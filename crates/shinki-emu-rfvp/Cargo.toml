[package]
name = "shinki-emu-rfvp"
version = "0.6.0"
edition = "2021"
license = "MPL-2.0"
build = "build.rs"

[lib]
name = "shinki_emu_rfvp"
crate-type = ["rlib", "cdylib"]
doctest = false

[features]
default = []
dynamic-plugin-export = ["shinki-emu-abi/diagnostic-bridge"]

[dependencies]
rfvp = { path = "../rfvp", default-features = false, features = ["embedded", "runtime-core-deps", "gpu-render", "audio", "mp4", "native-video", "random", "uuid-support", "image-formats", "bevy-utils", "fontdue-compat", "cursor-ani", "zlib-flate2", "logging"] }
shinki-emu-abi = { git = "https://github.com/Project-Shinkirou/ShinkiEMU", rev = "cb8d9dd22d7d0ab129085b324c94d6dc81fa19e3" }
anyhow = "1"
parking_lot = "0.12"
winit = "0.30.5"

[build-dependencies]
shinki-emu-build = { git = "https://github.com/Project-Shinkirou/ShinkiEMU", rev = "cb8d9dd22d7d0ab129085b324c94d6dc81fa19e3" }

[package.metadata.shinki]
upstream = "https://github.com/xmoezzz/rfvp"
upstream_revision = "af557db750c7833274f22a6d82b0dc33cdea2f85"
license_notice = "THIRD_PARTY_NOTICES.md"
modifications = "MODIFICATIONS.md"
